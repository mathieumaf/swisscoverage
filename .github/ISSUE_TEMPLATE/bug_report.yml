name: Bug report
description: Something does not work the way it should.
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected, and what you saw instead.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: The commands you ran or the request you made, and the output.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      description: The commit or release you are running.
