name: CI

# Everything a change has to pass before it can merge: one job per part of the
# repository, and a last one, `check`, that passes when all of them did.
# CONTRIBUTING.md lists the same commands to run locally.

on:
  push:
    branches: [main]
  pull_request:

# Cancel superseded runs on the same pull request. A run on main is never
# cancelled once it has started.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  backend:
    name: backend
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: backend
    env:
      # Use the Go that setup-go installed and fail if go.mod asks for
      # another one, instead of downloading a toolchain during the run.
      GOTOOLCHAIN: local
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Reads the version from the `go` line of go.mod.
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum

      - name: Formatting
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "Run gofmt on:"
            echo "$unformatted"
            exit 1
          fi

      - name: Module files are tidy
        run: go mod tidy -diff

      # The query code is generated from queries.sql and the migrations. This
      # fails when the committed code is not what they produce.
      - name: Generated code is current
        run: |
          go generate ./...
          if [ -n "$(git status --porcelain)" ]; then
            echo "Run 'go generate ./...' in backend/ and commit the result:"
            git status --short
            git diff
            exit 1
          fi

      - name: Vet
        run: go vet ./...

      # The database of deploy/compose.yaml, the one used locally.
      - name: Start the database
        working-directory: .
        run: docker compose -f deploy/compose.yaml up -d --wait

      # GitHub sets CI, which makes a test fail, instead of being skipped,
      # when it cannot reach the database.
      - name: Tests
        run: go test ./...

  # Markdown, JSON and YAML across the repository.
  docs:
    name: docs
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Reads the version from `packageManager` in package.json.
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Lint and formatting
        run: bun run lint

  # The website: its types against the API's contract, type checks, tests and
  # the production build.
  web:
    name: web
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: web
    env:
      ASTRO_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Reads the version from `packageManager` in the root package.json.
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # The types are generated from openapi.json. This fails when the
      # committed ones are not what the contract produces.
      - name: Generated types are current
        run: |
          bun run generate
          if [ -n "$(git status --porcelain)" ]; then
            echo "Run 'bun run generate' in web/ and commit the result:"
            git status --short
            git diff
            exit 1
          fi

      - name: Type check
        run: bun run check

      - name: Tests
        run: bun test

      - name: Build
        run: bun run build

  # The only check that branch protection requires. It runs even when a job
  # above failed or was cancelled: a job that is skipped counts as passed for
  # branch protection, and this one must not be skipped.
  check:
    name: check
    if: ${{ always() }}
    needs: [backend, docs, web]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Every job passed
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "Results of the other jobs: ${RESULTS:-none}"
          [ -n "$RESULTS" ] || exit 1
          for result in $RESULTS; do
            [ "$result" = "success" ] || exit 1
          done
