version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "chore(ci)"
    groups:
      github-actions:
        patterns: ["*"]

  # Go modules of the backend.
  - package-ecosystem: "gomod"
    directory: "/backend"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    commit-message:
      prefix: "fix"
      include: "scope"
    groups:
      # Majors stay ungrouped so each one is reviewed on its own.
      go-dependencies:
        patterns: ["*"]
        update-types: ["minor", "patch"]

  # The database image of deploy/compose.yaml.
  - package-ecosystem: "docker-compose"
    directory: "/deploy"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "chore"
      include: "scope"

  # JavaScript tools of the root (Bun reads package.json and bun.lock): Biome,
  # which checks Markdown, JSON, YAML and the website's TypeScript.
  - package-ecosystem: "bun"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    commit-message:
      prefix: "fix"
      prefix-development: "chore"
      include: "scope"
    groups:
      # Majors stay ungrouped so each one is reviewed on its own.
      js-production-dependencies:
        dependency-type: "production"
        patterns: ["*"]
        update-types: ["minor", "patch"]
      js-development-dependencies:
        dependency-type: "development"
        patterns: ["*"]
        update-types: ["minor", "patch"]

  # The website's dependencies: Astro, and the tools that check them.
  - package-ecosystem: "bun"
    directory: "/web"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    commit-message:
      prefix: "fix"
      prefix-development: "chore"
      include: "scope"
    groups:
      # Majors stay ungrouped so each one is reviewed on its own.
      web-production-dependencies:
        dependency-type: "production"
        patterns: ["*"]
        update-types: ["minor", "patch"]
      web-development-dependencies:
        dependency-type: "development"
        patterns: ["*"]
        update-types: ["minor", "patch"]
